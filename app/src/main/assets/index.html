<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pułkownik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: aplikacja mobilna — zielony pasek aplikacji, karty z tonalnym tłem, wyniki jako karty półek, historia w dolnym arkuszu */
:root{
  --bg:#C9D3C0; --surface:#FBFCF9; --surface-2:#DDE6D4; --ink:#1A2117; --muted:#525E4C; --line:#BCC8B2;
  --accent:#465C3E; --accent-ink:#FFF8EA; --accent-soft:#C3D3B7; --accent-text:#34472D;
  --bar1:#5F7556; --bar2:#41543A; --brass:#D6B06C; --brass-ink:#2A2412;
  --hole:#7E5A17; --hole-soft:#E6CD98;
  --warn-bg:#FBEBCF; --warn:#6E4708;
  --shadow:0 1px 2px rgba(30,37,27,.08),0 6px 20px rgba(30,37,27,.10);
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080B07; --surface:#141A12; --surface-2:#273022; --ink:#E9EEE5; --muted:#A3AE9C; --line:#3A4634;
  --accent:#93AD83; --accent-ink:#10150E; --accent-soft:#34452E; --accent-text:#BDD4AE;
  --bar1:#2E3B2A; --bar2:#1D251A; --brass:#D6B06C; --brass-ink:#2A2412;
  --hole:#E3BC74; --hole-soft:#4A3F26;
  --warn-bg:#3A2C12; --warn:#F2C26B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080B07; --surface:#141A12; --surface-2:#273022; --ink:#E9EEE5; --muted:#A3AE9C; --line:#3A4634;
  --accent:#93AD83; --accent-ink:#10150E; --accent-soft:#34452E; --accent-text:#BDD4AE;
  --bar1:#2E3B2A; --bar2:#1D251A; --brass:#D6B06C; --brass-ink:#2A2412;
  --hole:#E3BC74; --hole-soft:#4A3F26;
  --warn-bg:#3A2C12; --warn:#F2C26B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar2)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* pasek aplikacji */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,var(--bar1),var(--bar2));color:#F3EEDD;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.appbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--brass)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 1.55rem/1 var(--f-disp);letter-spacing:.03em;color:var(--brass)}
.brand small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:3px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--brass);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s}
.iconbtn:active{background:rgba(255,255,255,.18)}
.iconbtn .i-sun{display:none}
html.is-dark .iconbtn .i-sun{display:block}
html.is-dark .iconbtn .i-moon{display:none}

/* treść */
.app{max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:6px 16px;min-width:0}
details.card>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:56px;cursor:pointer;user-select:none}
details.card>summary::-webkit-details-marker{display:none}
.sec-ic{flex:none;width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.sec-t{flex:1;font-weight:700;font-size:1.02rem}
.chev{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:transform .32s}
details[open]>summary .chev{transform:rotate(180deg)}
details.closing>summary .chev{transform:none}
.body{display:grid;gap:12px;padding-top:4px;padding-bottom:10px}

/* pola */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
.grid2 .field{align-content:space-between}
.field{display:grid;gap:2px;background:var(--surface-2);border-radius:16px;padding:10px 14px 8px;border:2px solid transparent;transition:border-color .15s;cursor:text;min-width:0}
.field:focus-within{border-color:var(--accent)}
.f-lab{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.f-row{display:flex;align-items:baseline;gap:6px;min-width:0}
.field input{all:unset;flex:1 1 0;width:0;min-width:0;font:700 1.45rem var(--f-disp);letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.f-unit{flex:none;font-size:1rem;color:var(--accent-text);font-weight:700}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

.lbl{display:grid;gap:6px}
.lbl>.f-lab{padding-left:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:44px;padding:6px 10px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px rgba(30,37,27,.2)}

.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;background:var(--surface-2);border-radius:18px;padding:6px}
.stp{width:56px;height:52px;border:0;border-radius:14px;background:var(--surface);color:var(--accent-text);padding:0;line-height:0;display:grid;place-items:center;justify-self:center;cursor:pointer;box-shadow:var(--shadow);touch-action:manipulation}
.stp:active{background:var(--accent);color:var(--accent-ink)}
.stp:disabled{opacity:.35;cursor:default;box-shadow:none}
.stepper input{all:unset;display:block;width:100%;box-sizing:border-box;text-align:center;font:700 2rem var(--f-disp);color:var(--ink);min-width:0}
.stepper>div{min-width:0;text-align:center}
.stepper .cap{display:block;text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;margin-top:-4px}

.switch{display:flex;align-items:center;gap:14px;min-height:48px;cursor:pointer;padding:4px 4px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.thumb{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track .thumb{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:3px solid var(--brass);outline-offset:2px}
.sw-t{font-weight:600;font-size:.95rem}

/* wyniki */
.hero{background:linear-gradient(140deg,var(--bar1),var(--bar2));color:#F3EEDD;border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);display:grid;gap:12px}
.hero-t{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px;text-align:center}
.stat dt{font-size:.76rem;opacity:.8;font-weight:600}
.stat dd{margin:2px 0 0;font:700 1.9rem/1.05 var(--f-disp);color:var(--brass);font-variant-numeric:tabular-nums}
.stat dd small{font:600 .8rem var(--f-body);color:#F3EEDD;opacity:.7;margin-left:3px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:.88rem;font-weight:500;display:grid;gap:4px}

.shelves{display:grid;gap:10px}
.shelf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--surface-2);border-radius:18px;padding:12px 14px}
.badge{grid-row:span 4;align-self:center;width:66px;min-height:66px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;text-align:center}
.badge small{font:700 .66rem/1 var(--f-body);letter-spacing:.03em;text-transform:uppercase;opacity:.85}
.badge b{font:700 1.8rem/1 var(--f-disp)}
.s-lab{font-size:.74rem;color:var(--muted);font-weight:600}
.s-main{font:700 2rem/1 var(--f-disp);color:var(--hole);font-variant-numeric:tabular-nums}
.s-main small{font:600 .8rem var(--f-body);color:var(--muted);margin-left:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:600 1rem var(--f-disp);letter-spacing:.02em;padding:3px 10px;border-radius:999px;background:var(--hole-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.main{background:var(--hole);color:var(--surface)}
.s-sub{grid-column:2;font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;margin:0}

.textbtn{justify-self:center;border:0;background:transparent;color:var(--accent-text);font-weight:700;font-size:.95rem;padding:12px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.textbtn:active{background:var(--accent-soft)}

/* dolny arkusz historii */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,9,.45);animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:82vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3);padding-bottom:max(20px,env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
.sheet-top{position:sticky;top:0;z-index:1;background:linear-gradient(135deg,var(--bar1),var(--bar2));color:#F3EEDD;padding-top:8px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:grid;gap:10px;padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.handle{width:44px;height:5px;border-radius:3px;background:rgba(243,238,221,.4);margin:2px auto 10px}
.sheet-h{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.sheet-ic{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--brass);display:grid;place-items:center}
.sheet-h h2{flex:1;margin:0;font:700 1.45rem/1 var(--f-disp);letter-spacing:.03em;color:var(--brass)}
.smallbtn{border:0;background:rgba(255,255,255,.1);color:var(--brass);font-weight:700;font-size:.85rem;border-radius:999px;padding:10px 14px;cursor:pointer}
.closebtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--brass);display:grid;place-items:center;cursor:pointer}
.histempty{display:grid;justify-items:center;gap:8px;text-align:center;background:var(--surface);border-radius:22px;padding:24px 18px;box-shadow:var(--shadow)}
.he-ic{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;margin-bottom:4px}
.he-t{font-weight:700;font-size:1.05rem}
.he-s{font-size:.9rem;color:var(--muted);max-width:30ch}
.histitem{background:var(--surface)!important;box-shadow:var(--shadow)}
.histlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.histitem{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;border:2px solid transparent;background:var(--surface-2);border-radius:16px;padding:12px 14px;cursor:pointer}
.histitem.cur{border-color:var(--accent)}
.h1l{font-weight:700}
.htime{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.h2l{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.hgo{font-size:.85rem;font-weight:700;color:var(--accent-text)}
.histitem.cur .hgo{color:var(--muted);font-weight:500}
.confirm{display:grid;gap:10px;margin-top:6px;padding:14px;border-radius:16px;background:var(--accent-soft);font-size:.92rem;font-weight:500}
.cbtns{display:flex;gap:10px}
.cbtns button{flex:1;min-height:46px;border-radius:999px;border:0;font-weight:700;cursor:pointer}
.cbtns .yes{background:var(--accent);color:var(--accent-ink)}
.cbtns .no{background:var(--surface);color:var(--ink)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><rect x="4" y="3" width="2.4" height="18" rx=".8"/><rect x="17.6" y="3" width="2.4" height="18" rx=".8"/><rect x="4" y="3" width="16" height="2.2" rx=".8"/><rect x="4" y="18.8" width="16" height="2.2" rx=".8"/><rect x="6.4" y="13.2" width="11.2" height="1.6" rx=".5"/><rect x="6.4" y="15.9" width="11.2" height="1.6" rx=".5"/><path d="M12 6.2l.6 1.3 1.4.1-1.1.9.4 1.4-1.3-.8-1.3.8.4-1.4-1.1-.9 1.4-.1z"/><path d="M12 9.4l.6 1.3 1.4.1-1.1.9.4 1.4-1.3-.8-1.3.8.4-1.4-1.1-.9 1.4-.1z"/></svg>
    </div>
    <div class="brand"><h1>Pułkownik</h1><small>otwory na półki</small></div>
    <button type="button" class="iconbtn" id="histBtn" aria-label="Historia ustawień" aria-expanded="false" aria-controls="histPanel">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3.5V8h4.5"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
    <button type="button" class="iconbtn" id="themeBtn" aria-label="Przełącz tryb ciemny">
      <svg class="i-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</header>

<form class="app" id="f" autocomplete="off">

  <details class="card fold" open data-key="bok">
    <summary>
      <span class="sec-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M5 6h14M5 18h14"/></svg></span>
      <span class="sec-t">Korpus</span>
      <span class="chev"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </summary>
    <div class="body">
      <div class="grid2">
        <label class="field"><span class="f-lab">Wysokość boku</span><span class="f-row"><input type="number" inputmode="decimal" id="H" value="720" min="100" step="1"><span class="f-unit">mm</span></span></label>
        <label class="field"><span class="f-lab">Grubość wieńców</span><span class="f-row"><input type="number" inputmode="decimal" id="t" value="18" min="0" step="0.5"><span class="f-unit">mm</span></span></label>
      </div>
      <div class="lbl"><span class="f-lab">Wieńce górny i dolny</span>
        <div class="seg" id="kon" role="group" aria-label="Wieńce">
          <button type="button" data-v="between" aria-pressed="true">Między bokami</button>
          <button type="button" data-v="over" aria-pressed="false">Nakładane</button>
        </div>
      </div>
      <label class="field" id="cokolWrap"><span class="f-lab">Wieniec dolny podniesiony o (cokół)</span><span class="f-row"><input type="number" inputmode="decimal" id="c" value="0" min="0" step="1"><span class="f-unit">mm</span></span></label>
    </div>
  </details>

  <details class="card fold" open data-key="polki">
    <summary>
      <span class="sec-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 15h16"/><circle cx="6" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="18" cy="11" r="1.2" fill="currentColor" stroke="none"/></svg></span>
      <span class="sec-t">Półki</span>
      <span class="chev"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </summary>
    <div class="body">
      <div>
        <div class="stepper">
          <button type="button" class="stp" id="nMinus" aria-label="Mniej półek"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <div><input type="number" inputmode="numeric" id="n" value="2" min="1" max="20" step="1" aria-label="Liczba półek"><span class="cap">liczba półek</span></div>
          <button type="button" class="stp" id="nPlus" aria-label="Więcej półek"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
        </div>
      </div>
      <label class="field"><span class="f-lab">Grubość półki</span><span class="f-row"><input type="number" inputmode="decimal" id="ts" value="18" min="1" step="0.5"><span class="f-unit">mm</span></span></label>
      <div class="grid2">
        <label class="field"><span class="f-lab">Średnica otworu</span><span class="f-row"><input type="number" inputmode="decimal" id="dia" value="5" min="2" step="0.5"><span class="f-unit">mm</span></span></label>
        <label class="field"><span class="f-lab">Oś otworu poniżej spodu półki</span><span class="f-row"><input type="number" inputmode="decimal" id="p" value="2.5" min="0" step="0.5"><span class="f-unit">mm</span></span></label>
      </div>
      <div class="lbl"><span class="f-lab">Rozmieszczenie</span>
        <div class="seg" id="mode" role="group" aria-label="Rozmieszczenie">
          <button type="button" data-v="equal" aria-pressed="true">Równe prześwity</button>
          <button type="button" data-v="raster" aria-pressed="false">System 32</button>
        </div>
      </div>
      <div class="lbl"><span class="f-lab">Otworów na półkę (co 32 mm)</span>
        <div class="seg" id="k" role="group" aria-label="Otworów na półkę">
          <button type="button" data-v="0" aria-pressed="false">1 otwór</button>
          <button type="button" data-v="1" aria-pressed="true">3 otwory</button>
        </div>
      </div>
      <label class="switch" id="fullWrap" hidden><input type="checkbox" id="full" role="switch"><span class="track"><span class="thumb"></span></span><span class="sw-t">Wierć pełny rząd rastra</span></label>
      <label class="switch"><input type="checkbox" id="round" role="switch" checked><span class="track"><span class="thumb"></span></span><span class="sw-t">Zaokrąglaj do pełnych milimetrów</span></label>
    </div>
  </details>

  <section class="hero" aria-label="Podsumowanie">
    <div class="hero-t">Podsumowanie</div>
    <dl class="stats" id="sum"></dl>
    <div id="warn" class="warn" hidden></div>
  </section>

  <details class="card fold" open data-key="tabela">
    <summary>
      <span class="sec-ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/></svg></span>
      <span class="sec-t">Wymiary</span>
      <span class="chev"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </summary>
    <div class="body">
      <div class="seg" id="dir" role="group" aria-label="Kierunek pomiaru">
        <button type="button" data-v="dol" aria-pressed="true">Od dołu</button>
        <button type="button" data-v="gora" aria-pressed="false">Od góry</button>
      </div>
      <div class="shelves" id="tbl"></div>
      <div class="shelves" id="tblTop" hidden></div>
    </div>
  </details>

  <button type="button" class="textbtn" id="reset">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3.5V8h4.5"/></svg>
    Przywróć domyślne
  </button>
</form>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="histPanel" hidden aria-label="Historia ustawień" role="dialog" aria-modal="true">
  <div class="sheet-top">
    <div class="handle" aria-hidden="true"></div>
    <div class="sheet-h">
      <span class="sheet-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3.5V8h4.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <h2>Historia</h2>
      <button type="button" class="smallbtn" id="histClear">Wyczyść</button>
      <button type="button" class="closebtn" id="histClose" aria-label="Zamknij historię"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="sheet-in">
    <div class="confirm" id="histClearConfirm" hidden>
      <span>Usunąć całą historię? Tej operacji nie można cofnąć.</span>
      <div class="cbtns"><button type="button" class="yes" id="histClearYes">Usuń historię</button><button type="button" class="no" id="histClearNo">Anuluj</button></div>
    </div>
    <ol class="histlist" id="histList"></ol>
  </div>
</section>

<script>
(function(){
const $=id=>document.getElementById(id);
const DEF={H:720,D:560,t:18,c:0,n:2,ts:18,p:2.5,k:1,fx:37,bx:37,dia:5,full:false,round:true,kon:"between",mode:"equal"};
const numIds=["H","t","c","n","ts","p","dia"];
let state={...DEF};
try{const s=JSON.parse(localStorage.getItem("otwory-polki-v5")||"null");if(s)state={...DEF,...s};}catch(e){}

function setSeg(id,v){document.querySelectorAll("#"+id+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));}
function toForm(){numIds.forEach(id=>$(id).value=state[id]);state.k=state.k>=1?1:0;$("full").checked=state.full;$("round").checked=state.round;
  setSeg("kon",state.kon);setSeg("mode",state.mode);setSeg("k",String(state.k));}
function fromForm(){numIds.forEach(id=>{const v=parseFloat($(id).value);state[id]=isFinite(v)?v:0;});
  state.n=Math.max(0,Math.round(state.n));state.full=$("full").checked;state.round=$("round").checked;}
const r1=x=>Math.round(x*10)/10;
const fmt=x=>{const v=state.round?Math.round(x):r1(x);return (Number.isInteger(v)?v.toString():v.toFixed(1)).replace(".",",");};

function compute(s){
  const warn=[];
  const between=s.kon==="between";
  const inB=between? s.c+s.t : 0;
  const inT=between? s.H-s.t : s.H;
  const inner=inT-inB;
  let shelves=[], raster=[];
  if(inner<=0){warn.push("Wnętrze ma zerową lub ujemną wysokość. Sprawdź wysokość boku, grubość wieńców i cokół.");return {inB,inT,inner,shelves,raster,warn};}
  const gap=(inner-s.n*s.ts)/(s.n+1);
  if(gap<=0){warn.push("Półki nie mieszczą się we wnętrzu. Zmniejsz ich liczbę lub grubość.");return {inB,inT,inner,shelves,raster,warn};}
  if(s.mode==="raster"){
    const m=Math.min(40,inner/4);
    const lo=inB+m, hi=inT-m;
    const cnt=Math.max(1,Math.floor((hi-lo)/32)+1);
    const y0=(lo+hi)/2-(cnt-1)*16;
    for(let i=0;i<cnt;i++)raster.push(y0+i*32);
  }
  for(let i=1;i<=s.n;i++){
    const bottom=inB+i*gap+(i-1)*s.ts;
    let hole=bottom-s.p;
    if(raster.length){hole=raster.reduce((a,b)=>Math.abs(b-hole)<Math.abs(a-hole)?b:a);}
    if(s.round)hole=Math.round(hole);
    shelves.push({i,hole,bottom:hole+s.p});
  }
  if(raster.length){
    for(let i=1;i<shelves.length;i++)if(Math.abs(shelves[i].hole-shelves[i-1].hole)<1){warn.push("Dwie półki trafiły na ten sam otwór rastra. Zmniejsz liczbę półek.");break;}
  }
  let prev=inB;
  shelves.forEach(sh=>{sh.gapBelow=sh.bottom-prev;prev=sh.bottom+s.ts;});
  const gapTop=inT-prev;
  shelves.forEach(sh=>{sh.adj=[];for(let j=1;j<=s.k;j++){[sh.hole-32*j,sh.hole+32*j].forEach(y=>sh.adj.push(y));}sh.adj.sort((a,b)=>a-b);
    if(sh.adj.some(y=>y<inB+s.dia||y>inT-s.ts-s.p))warn.push("Przy półce "+sh.i+" skrajny otwór wypada przy wieńcu lub w nim. Zmniejsz liczbę otworów albo przesuń półkę.");});
  shelves.forEach(sh=>{if(sh.hole<inB||sh.bottom+s.ts>inT)warn.push("Półka "+sh.i+" wychodzi poza wnętrze szafki.");});
  return {inB,inT,inner,shelves,raster,gapTop,warn};
}

function shelfCard(i,main,mainLab,holes,sub){
  return `<article class="shelf">
    <div class="badge"><small>Półka</small><b>${i}</b></div>
    <div class="s-lab">${mainLab}</div>
    <div class="s-main">${main}<small>mm</small></div>
    <div class="chips">${holes}</div>
    ${sub?`<div class="s-sub">${sub}</div>`:""}
  </article>`;
}

function render(){
  const s=state, R=compute(s);
  $("cokolWrap").hidden=s.kon!=="between";
  $("fullWrap").hidden=s.mode!=="raster";
  $("nMinus").disabled=s.n<=1;$("nPlus").disabled=s.n>=20;
  const w=$("warn"); w.hidden=!R.warn.length; w.innerHTML=R.warn.map(x=>"<div>"+x+"</div>").join("");
  const gaps=R.shelves.map(x=>x.gapBelow).concat(R.shelves.length?[R.gapTop]:[]);
  $("sum").innerHTML=[
    ["Wnętrze",R.inner>0?fmt(R.inner):"—"],
    ["Prześwit",gaps.length?(s.mode==="equal"?fmt(gaps[0]):fmt(Math.min(...gaps))+"–"+fmt(Math.max(...gaps))):"—"],
  ].map(([a,b])=>`<div class="stat"><dt>${a}</dt><dd>${b}${b!=="—"?"<small>mm</small>":""}</dd></div>`).join("");
  const none='<p class="empty">Brak półek do wyznaczenia.</p>';
  $("tbl").innerHTML=R.shelves.length?R.shelves.map(sh=>{
    const all=sh.adj.concat([sh.hole]).sort((a,b)=>a-b);
    const chips=all.length>1?all.map(y=>`<span class="chip${y===sh.hole?" main":""}">${fmt(y)}</span>`).join(""):"";
    return shelfCard(sh.i,fmt(sh.hole),"Oś otworu od dołu",chips,"Spód półki: "+fmt(sh.bottom)+" mm");
  }).join(""):none;
  $("tblTop").innerHTML=R.shelves.length?R.shelves.map(sh=>{
    const top=y=>s.H-y;
    const all=sh.adj.concat([sh.hole]).sort((a,b)=>b-a);
    const chips=all.length>1?all.map(y=>`<span class="chip${y===sh.hole?" main":""}">${fmt(top(y))}</span>`).join(""):"";
    return shelfCard(sh.i,fmt(top(sh.hole)),"Oś otworu od góry",chips,"Wierzch półki od góry: "+fmt(top(sh.bottom+s.ts))+" mm");
  }).join(""):none;
  try{localStorage.setItem("otwory-polki-v5",JSON.stringify(state));}catch(e){}
  if(histReady)histSchedule();
}

$("f").addEventListener("input",()=>{fromForm();render();});
$("f").addEventListener("change",()=>{fromForm();render();});
$("f").addEventListener("submit",e=>e.preventDefault());
let dir="dol";try{if(localStorage.getItem("otwory-kierunek")==="gora")dir="gora";}catch(e){}
function syncDir(anim){setSeg("dir",dir);$("tbl").hidden=dir!=="dol";$("tblTop").hidden=dir!=="gora";
  const el=$(dir==="dol"?"tbl":"tblTop");
  if(anim&&el.animate&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))el.animate([{opacity:0,transform:"translateX("+(dir==="dol"?"-":"")+"14px)"},{opacity:1,transform:"none"}],{duration:340,easing:"cubic-bezier(.2,.75,.25,1)"});}
syncDir();
$("dir").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(dir===b.dataset.v)return;dir=b.dataset.v;syncDir(true);try{localStorage.setItem("otwory-kierunek",dir);}catch(e){}});
$("k").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state.k=+b.dataset.v;setSeg("k",b.dataset.v);render();});
["kon","mode"].forEach(id=>$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;state[id]=b.dataset.v;setSeg(id,b.dataset.v);render();}));
function stepN(d){const v=Math.min(20,Math.max(1,(Math.round(state.n)||0)+d));$("n").value=v;fromForm();render();}
$("nMinus").addEventListener("click",()=>stepN(-1));
$("nPlus").addEventListener("click",()=>stepN(1));

// motyw
const root=document.documentElement;
function sysDark(){return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);}
function isDark(){const t=root.getAttribute("data-theme");if(t)return t==="dark";return sysDark();}
function syncTheme(){const d=isDark();root.classList.toggle("is-dark",d);$("themeBtn").setAttribute("aria-pressed",d);}
try{const th=localStorage.getItem("otwory-motyw");if(th==="dark"||th==="light")root.setAttribute("data-theme",th);}catch(e){}
syncTheme();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme);}catch(e){}
$("themeBtn").addEventListener("click",()=>{const next=isDark()?"light":"dark";
  if((next==="dark")===sysDark()){root.removeAttribute("data-theme");try{localStorage.removeItem("otwory-motyw");}catch(e){}}
  else{root.setAttribute("data-theme",next);try{localStorage.setItem("otwory-motyw",next);}catch(e){}}
  syncTheme();});

// zwijane sekcje
document.querySelectorAll("details.fold").forEach(d=>{
  const key="otwory-zw2-"+d.dataset.key;
  let open=d.dataset.default!=="0";
  try{const v=localStorage.getItem(key);if(v==="1")open=true;else if(v==="0")open=false;}catch(e){}
  d.open=open;
  d.addEventListener("toggle",()=>{try{localStorage.setItem(key,d.open?"1":"0");}catch(e){}});
  // animacja rozwijania i zwijania
  const sm=d.querySelector("summary"), body=d.querySelector(".body");
  let anim=null;
  sm.addEventListener("click",e=>{
    const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce||!body.animate)return;
    e.preventDefault();
    if(anim){anim.cancel();anim=null;}
    const opening=!d.open||d.classList.contains("closing");
    body.style.overflow="hidden";
    if(opening){
      d.classList.remove("closing");d.open=true;
      const h=body.scrollHeight;
      anim=body.animate([{height:"0px",opacity:0,transform:"translateY(-6px)"},{height:h+"px",opacity:1,transform:"none"}],{duration:400,easing:"cubic-bezier(.2,.75,.25,1)"});
      anim.onfinish=()=>{body.style.overflow="";anim=null;};
    }else{
      const h=body.scrollHeight;
      d.classList.add("closing");
      anim=body.animate([{height:h+"px",opacity:1,transform:"none"},{height:"0px",opacity:0,transform:"translateY(-6px)"}],{duration:320,easing:"cubic-bezier(.4,0,.6,1)"});
      anim.onfinish=()=>{d.open=false;d.classList.remove("closing");body.style.overflow="";anim=null;};
    }
  });
});

// historia
const HKEY="otwory-historia", HKEYS=["H","t","c","n","ts","p","k","dia","full","round","kon","mode"];
let histReady=false, histTimer=null, hist=[], histPending=null;
try{hist=JSON.parse(localStorage.getItem(HKEY)||"[]");if(!Array.isArray(hist))hist=[];}catch(e){hist=[];}
const snap=()=>{const o={};HKEYS.forEach(k=>o[k]=state[k]);return o;};
const same=(a,b)=>HKEYS.every(k=>a[k]===b[k]);
function histSave(){
  histTimer=null;
  const sn=snap();
  hist=hist.filter(h=>!same(h.s,sn));
  hist.unshift({t:Date.now(),s:sn});
  hist=hist.slice(0,5);
  try{localStorage.setItem(HKEY,JSON.stringify(hist));}catch(e){}
  histRender();
}
function histSchedule(){clearTimeout(histTimer);histTimer=setTimeout(histSave,1500);}
function plPolki(n){const a=n%10,b=n%100;return n===1?"półka":(a>=2&&a<=4&&!(b>=12&&b<=14))?"półki":"półek";}
function histTime(t){const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,"0");
  const hm=p(d.getHours())+":"+p(d.getMinutes());
  return d.toDateString()===n.toDateString()?hm:p(d.getDate())+"."+p(d.getMonth()+1)+" "+hm;}
function histRender(){
  const L=$("histList");
  if(!hist.length){L.innerHTML='<li class="histempty"><span class="he-ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3.5V8h4.5"/><path d="M12 7.5V12l3 2"/></svg></span><span class="he-t">Historia jest pusta</span><span class="he-s">Zapisane ustawienia pojawią się tutaj, gdy zmienisz wymiary.</span></li>';$("histClear").hidden=true;return;}
  $("histClear").hidden=false;
  const cur=snap();
  L.innerHTML=hist.map((h,i)=>{
    const s=h.s, R=compute(s), f=x=>{const v=s.round?Math.round(x):Math.round(x*10)/10;return String(v).replace(".",",");};
    const holes=R.shelves.map(sh=>f(sh.hole)).join(", ")||"—";
    const isCur=same(s,cur);
    return `<li><button type="button" class="histitem${isCur?" cur":""}" data-i="${i}">
      <span class="h1l">${f(s.H)} mm · ${s.n} ${plPolki(s.n)}</span><span class="htime">${histTime(h.t)}</span>
      <span class="h2l">${s.kon==="between"?"wieńce między bokami":"wieńce nakładane"} · osie: ${holes}</span><span class="hgo">${isCur?"obecne":"Przywróć"}</span>
    </button>${histPending===i?`<div class="confirm">
      <span>Przywrócić te ustawienia? Obecne zostaną zastąpione.</span>
      <div class="cbtns"><button type="button" class="yes hc-yes" data-i="${i}">Przywróć</button><button type="button" class="no hc-no">Anuluj</button></div>
    </div>`:""}</li>`;}).join("");
}
function openSheet(){if(histTimer){clearTimeout(histTimer);histSave();}histPending=null;$("histClearConfirm").hidden=true;histRender();
  $("scrim").hidden=false;$("histPanel").hidden=false;$("histBtn").setAttribute("aria-expanded","true");$("histClose").focus();}
function closeSheet(){$("scrim").hidden=true;$("histPanel").hidden=true;$("histBtn").setAttribute("aria-expanded","false");}
$("histBtn").addEventListener("click",()=>{$("histPanel").hidden?openSheet():closeSheet();});
$("histClose").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("histPanel").hidden)closeSheet();});
$("histList").addEventListener("click",e=>{
  if(e.target.closest(".hc-no")){histPending=null;histRender();return;}
  const it=e.target.closest(".histitem");
  if(it){$("histClearConfirm").hidden=true;const i=+it.dataset.i;if(it.classList.contains("cur"))return;histPending=histPending===i?null:i;histRender();
    const y=$("histList").querySelector(".hc-yes");if(y)y.focus();return;}
  const b=e.target.closest(".hc-yes");if(!b)return;
  histPending=null;
  const h=hist[+b.dataset.i];if(!h)return;
  state={...DEF,...h.s};toForm();render();clearTimeout(histTimer);histTimer=null;histRender();
  closeSheet();window.scrollTo({top:0,behavior:"smooth"});});
$("histClear").addEventListener("click",()=>{histPending=null;histRender();const c=$("histClearConfirm");c.hidden=!c.hidden;if(!c.hidden)$("histClearNo").focus();});
$("histClearNo").addEventListener("click",()=>{$("histClearConfirm").hidden=true;});
$("histClearYes").addEventListener("click",()=>{hist=[];try{localStorage.removeItem(HKEY);}catch(e){}$("histClearConfirm").hidden=true;closeSheet();histRender();});

$("reset").addEventListener("click",()=>{state={...DEF};toForm();render();window.scrollTo({top:0,behavior:"smooth"});});
toForm();render();histReady=true;histRender();
})();
</script>
</body>
</html>
