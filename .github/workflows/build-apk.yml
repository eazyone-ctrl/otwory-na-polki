name: Zbuduj APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Budowanie APK
        run: gradle assembleRelease --no-daemon

      - name: Zmiana nazwy pliku
        run: cp app/build/outputs/apk/release/app-release.apk otwory-na-polki.apk

      - uses: actions/upload-artifact@v4
        with:
          name: otwory-na-polki-apk
          path: otwory-na-polki.apk

      - name: Publikacja w Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete najnowsza --yes --cleanup-tag || true
          gh release create najnowsza otwory-na-polki.apk \
            --title "Otwory na półki – najnowsza wersja" \
            --notes "Pobierz plik otwory-na-polki.apk na telefonie i zainstaluj."
